<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacky AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🤖 Jacky AI</h1>
<p>உங்கள் AI உதவியாளர்</p>
</header>

<nav>
<button onclick="showPage('home')">🏠 முகப்பு</button>
<button onclick="showPage('ai')">💬 AI</button>
<button onclick="showPage('salary')">💵 சம்பளம்</button>
<button onclick="showPage('purchase')">📊 கொள்முதல்</button>
</nav>

<main>
<section id="home" class="page active">
<h2>வணக்கம் 👋</h2>
<p>Jacky AI-க்கு வரவேற்கிறோம்.</p>
</section>

<section id="ai" class="page">
<h2>💬 Jacky AI Assistant</h2>
<div id="chatBox" class="chat-box">
<div class="message ai">வணக்கம்! உங்கள் கேள்வியை உள்ளிடுங்கள்.</div>
</div>
<div id="status">🎤 மைக் ஆஃப்</div>
<textarea id="textInput" placeholder="உங்கள் கேள்வி..."></textarea>
<button onclick="sendMessage()">📤 அனுப்பு</button>
<button onclick="startListening()">🎤 மைக் ஆன்</button>
<button onclick="stopListening()">⏹️ மைக் நிறுத்து</button>
<button onclick="clearChat()">🗑️ அழி</button>
</section>

<section id="salary" class="page">
<h2>💵 சம்பளம்</h2>
<input type="number" id="salaryAmount" placeholder="சம்பளம்">
<button onclick="calculateSalary()">கணக்கிடு</button>
<div id="salaryResult"></div>
</section>

<section id="purchase" class="page">
<h2>📊 கொள்முதல்</h2>
<input type="text" id="productName" placeholder="பொருள்">
<input type="number" id="productPrice" placeholder="விலை">
<button onclick="addPurchase()">சேர்</button>
<div id="purchaseResult"></div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
